name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --all-extras
      - run: uv run python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    # `sandboxd` exists so an application never needs the Docker socket, and the
    # answer to "how do I run it" was "write a Dockerfile" — friction at exactly
    # the point where somebody decides whether the safe path is worth it.
    #
    # Built from the tag's source rather than from the release just pushed to
    # PyPI: same code either way, and no window in which the index has not caught
    # up. Independent of the job above for the same reason.
    name: GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sandboxd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
